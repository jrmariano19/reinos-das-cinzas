name: Testes do jogo
on:
  push:
    branches:
      - dev/priston-inspired-systems
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts, projeção e integrações
        run: npm test
